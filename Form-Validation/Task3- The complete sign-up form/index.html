<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The complete sign-up form</title>
</head>
<body>
  <form id="signUpForm">
    <fieldset>
      <legend>The complete sign-up form</legend>
      <input id="fullName"  placeholder="Full Name"><br><br>
      <input id="email" placeholder="email"><br><br>
      <input id="age" placeholder="Age"><br><br>
      <input id="password" type="password" placeholder="Password"><br><br>
      <input id="confirmPassword" type="password" placeholder="Confirm password"><br><br>
      <label><input id="terms" type="checkbox"> I agree to the terms</label><br>
    </fieldset><br>
    <button type="submit">Create account</button>
  </form>
  <p id="signupMsg"></p>


  <script src="script.js"></script>
</body>
</html>
